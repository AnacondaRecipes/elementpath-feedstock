{% set name = "elementpath" %}
{% set version = "5.1.2" %}
{% set deselect_tests = " --deselect=tests/test_package.py::PackageTest::test_missing_debug_statements" %}
{% set deselect_tests = 'deselect_tests + " --deselect=tests/test_package.py::PackageTest::test_python_requirement"' %}
{% set deselect_tests = 'deselect_tests + " --deselect=tests/test_package.py::PackageTest::test_version_matching"' %}

# >           raise RuntimeError("input() already active")
# E           RuntimeError: input() already active
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 43d67a38700153eb45349c6e14a4d4b3a06e390c31df06539f730a96baf9a7fc

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=77.0
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - elementpath
    - elementpath.aliases
    - elementpath.collations
    - elementpath.compare
    - elementpath.datatypes
    - elementpath.datatypes.atomic_types
    - elementpath.datatypes.datetime
    - elementpath.decoder
    - elementpath.etree
    - elementpath.exceptions
    - elementpath.extras.pathnodes
    - elementpath.helpers
    - elementpath.namespaces
    - elementpath.protocols
    - elementpath.regex
    - elementpath.regex.codepoints
    - elementpath.schema_proxy
    - elementpath.sequence_types
    - elementpath.serialization
    - elementpath.tdop
    - elementpath.tree_builders
    - elementpath.validators
    - elementpath.xpath_context
    - elementpath.xpath_nodes
    - elementpath.xpath_tokens
    - elementpath.xpath1
    - elementpath.xpath2
    - elementpath.xpath3
    - elementpath.xpath30
    - elementpath.xpath30.xpath30_helpers
    - elementpath.xpath31
  requires:
    - pytest
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests {{ deselect_tests }}

about:
  home: https://github.com/sissaschool/elementpath
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: XPath 1.0/2.0 parsers and selectors for ElementTree
  description: |
    The proposal of this package is to provide XPath 1.0, 2.0 and 3.0
    selectors for ElementTree XML data structures, both for the standard
    ElementTree library and for the lxml.etree library.
    For lxml.etree this package can be useful for providing XPath 2.0 3.0
    selectors, because lxml.etree already has it's own implementation of
    XPath 1.0.
  dev_url: https://github.com/sissaschool/elementpath
  doc_url: https://github.com/sissaschool/elementpath

extra:
  recipe-maintainers:
    - ccwang002
